<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chris Wang — Games</title>
  <meta name="description" content="Games by Chris Wang.">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=EB+Garamond:wght@400;500&family=Playfair+Display:wght@400;500&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400&display=swap">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" data-site="name">Chris Wang</a>
    <nav class="topnav" aria-label="Primary" data-site="nav"></nav>
  </header>

  <main id="top">
    <!-- 1. Hero -->
    <section class="hero" aria-label="Introduction">
      <div class="hero-bg" aria-hidden="true">
        <img data-site="hero-bg" alt="">
        <canvas class="hero-dust"></canvas>
      </div>
      <div class="hero-text">
        <h1 class="hero-l1" data-site="hero-line1"></h1>
        <p class="hero-l2" data-site="hero-line2"></p>
        <p class="hero-l3" data-site="hero-line3"></p>
      </div>
    </section>

    <!-- 2. Work carousel -->
    <section class="work" id="work" aria-label="Work">
      <div class="work-ambient" aria-hidden="true"><span></span><span></span></div>
      <div class="reel" data-reel>
        <div class="reel-frame">
          <div class="reel-stage" aria-live="polite"></div>
          <span class="reel-count"></span>
          <button class="reel-arrow prev" type="button" aria-label="Previous image">&#8249;</button>
          <button class="reel-arrow next" type="button" aria-label="Next image">&#8250;</button>
        </div>
        <div class="reel-caption">
          <a class="reel-title" href="#"></a>
          <a class="reel-link" href="#"></a>
          <p class="reel-summary"></p>
        </div>
        <div class="reel-tabs" role="tablist" aria-label="Projects"></div>
      </div>
    </section>

    <!-- 3. Info -->
    <footer class="info" id="contact">
      <div class="info-grid">
        <div>
          <div class="label">Contact</div>
          <a data-site="email"></a>
        </div>
        <div>
          <div class="label">Practice</div>
          <span data-site="role"></span>
        </div>
        <div>
          <div class="label">Index</div>
          <ul class="info-index" data-site="index"></ul>
        </div>
        <div>
          <div class="label">Colophon</div>
          <span data-site="colophon"></span>
        </div>
      </div>
      <div class="info-base">
        <span>&copy; <span data-site="year"></span> Chris Wang</span>
      </div>
    </footer>
  </main>

  <!-- TEMPORARY style switcher: remove this block and assets/style-switcher.js once a style is chosen -->
  <script src="assets/style-switcher.js" defer></script>

  <script src="assets/site-config.js"></script>
  <script src="assets/site.js" defer></script>
</body>
</html>
